<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LensWiki Admin</title>
    <meta name="robots" content="noindex">
    <!-- Bump admin asset version after changing admin JS/config. -->
    <link rel="stylesheet" href="admin.css?v=20260527-5">
  </head>
  <body>
    <header class="admin-topbar">
      <a class="brand" href="index.html" aria-label="LensWiki archive">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>LensWiki</span>
      </a>
      <a class="archive-link" href="index.html">Back to archive</a>
    </header>

    <main class="admin-shell">
      <section class="admin-card" aria-labelledby="adminTitle">
        <h1 id="adminTitle">LensWiki Admin</h1>
        <p class="intro">Manage lens records.</p>

        <div class="notice warning" id="configNotice" hidden>
          Admin configuration missing.
        </div>

        <div class="notice" id="statusMessage" aria-live="polite" hidden></div>

        <section class="login-view" id="loginView">
          <form class="login-form" id="loginForm">
            <label>
              Email
              <input id="emailInput" type="email" autocomplete="email" required>
            </label>
            <label>
              Password
              <input id="passwordInput" type="password" autocomplete="current-password" required>
            </label>
            <button class="primary-button" id="loginButton" type="submit">Log in</button>
          </form>
        </section>

        <section class="admin-view" id="adminView" hidden>
          <section class="access-card" id="adminAccessCard">
            <p class="access-kicker" id="accessKicker">Admin session active</p>
            <h2 id="accessTitle">Admin access confirmed.</h2>
            <p id="accessCopy">Lens editor coming next.</p>
          </section>

          <section class="admin-dashboard" id="adminDashboard">
            <div class="dashboard-head">
              <div>
                <p class="access-kicker">Dashboard</p>
                <h2>Lens records</h2>
              </div>
              <strong id="supabaseRecordCount">Loading...</strong>
            </div>

            <p class="dashboard-status" id="dashboardStatus">Loading lens records...</p>
            <div class="records-table" id="supabaseRecordsList" hidden></div>

            <div class="dashboard-actions">
              <div>
                <button class="secondary-button" type="button" disabled>Import JSON records</button>
                <p>Import tool coming next.</p>
              </div>
              <div>
                <button class="secondary-button" type="button" disabled>New lens</button>
                <p>Lens editor coming next.</p>
              </div>
            </div>

          </section>

          <div class="dashboard-footer">
            <button class="danger-button" id="logoutButton" type="button">Log out</button>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20260527-5"></script>
    <script src="admin.js?v=20260527-5" defer></script>
  </body>
</html>
