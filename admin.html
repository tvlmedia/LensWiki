<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LensWiki Admin</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <header class="admin-topbar">
      <a class="brand" href="index.html" aria-label="LensWiki archive">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>LensWiki</span>
      </a>
      <a class="archive-link" href="index.html">Back to archive</a>
    </header>

    <main class="admin-shell">
      <section class="admin-card" aria-labelledby="adminTitle">
        <p class="eyebrow">Private admin</p>
        <h1 id="adminTitle">LensWiki Admin</h1>
        <p class="intro">
          Sign in with your Supabase Auth account. Admin access is verified against
          <code>public.lenswiki_admins</code>.
        </p>

        <div class="notice warning" id="configNotice" hidden>
          Supabase config missing. Add Project URL and anon key to
          <code>supabase-config.js</code>.
        </div>

        <div class="notice" id="statusMessage" aria-live="polite" hidden></div>

        <form class="login-form" id="loginForm">
          <label>
            Email
            <input id="emailInput" type="email" autocomplete="email" required>
          </label>
          <label>
            Password
            <input id="passwordInput" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" id="loginButton" type="submit">Log in</button>
        </form>

        <section class="session-panel" id="sessionPanel" hidden>
          <div>
            <span>Signed in as</span>
            <strong id="userEmail"></strong>
          </div>
          <button class="secondary-button" id="logoutButton" type="button">Log out</button>
        </section>

        <section class="access-card" id="adminAccessCard" hidden>
          <p class="access-kicker" id="accessKicker"></p>
          <h2 id="accessTitle"></h2>
          <p id="accessCopy"></p>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js" defer></script>
  </body>
</html>
